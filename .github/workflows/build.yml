name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Unit tests
        run: ./gradlew :shulker-launcher:test :shulker-format:test
      - name: Build Shulker jar
        run: ./gradlew createShulkerJar --stacktrace
      - name: Launcher dry run
        # Plans flags on the CI machine's JDK 25 without starting the server.
        run: mkdir -p run && cd run && java -jar ../build/libs/shulker-*.jar --dry-run nogui
      - name: Plugin smoke test
        # Boots the server with LuckPerms, WorldEdit, ViaVersion, packetevents, PlaceholderAPI
        # and EssentialsX; fails if any plugin does not enable. Accepts the Minecraft EULA for
        # the throwaway test server.
        run: scripts/plugin-smoke-test.sh
      - name: Upload smoke test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: run-smoke/server.log
      - name: Upload Shulker jar
        uses: actions/upload-artifact@v4
        with:
          name: shulker
          path: build/libs/shulker-*.jar
