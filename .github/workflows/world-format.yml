name: World format

# End-to-end .shulk storage test on a real server (~25 minutes): migration, restarts,
# conversion both ways and a native world, verifying every chunk after each step.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  world-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Build
        run: ./gradlew applyAllPatches createShulkerJar
      - name: Test world storage
        # Accepts the Minecraft EULA for the throwaway test servers.
        run: scripts/world-format-test.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-format-logs
          path: run-world-test/*/run.log
